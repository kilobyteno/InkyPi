<div class="form-group">
    <label for="base_url" class="form-label">Dagr API Base URL:</label>
    <input type="text" id="base_url" name="base_url" placeholder="https://api.dagr.no" required class="form-input" value="https://api.dagr.no">
</div>

<div class="form-group">
    <label for="email" class="form-label">Account Email:</label>
    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required class="form-input">
</div>

<div class="form-group">
    <label for="activation_code" class="form-label">Device Activation Code:</label>
    <input type="text" id="activation_code" name="activation_code" placeholder="Enter activation code" required class="form-input" maxlength="16">
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('base_url').value = pluginSettings.base_url || '';
            document.getElementById('email').value = pluginSettings.email || '';
            document.getElementById('activation_code').value = pluginSettings.activation_code || '';
        }
    });
</script>
