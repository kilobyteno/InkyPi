<div class="form-group">
    <label for="base_url" class="form-label">Dagr API Base URL:</label>
    <input type="text" id="base_url" name="base_url" placeholder="https://api.dagr.no" class="form-input" value="https://api.dagr.no">
    <small class="form-hint">Leave empty to use DAGR_API_URL environment variable</small>
</div>

<div class="form-group">
    <label for="email" class="form-label">Account Email:</label>
    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required class="form-input">
</div>

<div class="form-group">
    <label for="activation_code" class="form-label">Device Activation Code:</label>
    <input type="text" id="activation_code" name="activation_code" placeholder="Enter activation code" required class="form-input" maxlength="16">
</div>

<div class="form-group">
    <div class="form-group">
        <label for="padImage" class="form-label">Scale to Fit:</label>
        <div class="toggle-container">
            <input type="checkbox" id="padImage" name="padImage" class="toggle-checkbox" value="false">
            <label for="padImage" class="toggle-label"></label>
        </div>
        <!-- Hidden input ensures 'true' is always sent when unchecked -->
        <input type="hidden" name="padImage" value="true">
    </div>

    <div class="form-group">
        <label for="random_order" class="form-label">Random Order:</label>
        <div class="toggle-container">
            <input type="checkbox" id="random_order" name="random_order" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="random_order" class="toggle-label"></label>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="backgroundOption">Background:</label>
        <div class="form-group">
            <input type="radio" id="backgroundOptionBlur" name="backgroundOption" value="blur">
            <label for="backgroundOptionBlur">Blur</label>
            <input type="radio" id="backgroundOptionColor" name="backgroundOption" value="color">
            <label for="backgroundOptionColor">Color</label>
            <input type="color" id="backgroundColor" name="backgroundColor" value="#ffffff" class="color-picker"/>
        </div>
    </div>
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        let backgroundOption = "blur"
        if (loadPluginSettings) {
            document.getElementById('base_url').value = pluginSettings.base_url || '';
            document.getElementById('email').value = pluginSettings.email || '';
            document.getElementById('activation_code').value = pluginSettings.activation_code || '';
            document.getElementById('padImage').checked = pluginSettings.padImage == 'false';
            document.getElementById('random_order').checked = pluginSettings.random_order == 'true';
            document.getElementById('backgroundColor').value = pluginSettings.backgroundColor || '#ffffff';
            backgroundOption = pluginSettings.backgroundOption || 'blur'
        }
        document.querySelector(`input[name="backgroundOption"][value="${backgroundOption}"]`).checked = true;
    });
</script>
